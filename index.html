<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mall Map Generator</title>
<style>
  :root {
    --bg: #f4f1ea;
    --ink: #2b2b2b;
    --wall: #d63c3c;   /* red edge = wall */
    --open: #3d55c9;   /* blue edge = open / walkable */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header { padding: 14px 20px 6px; }
  header h1 { margin: 0 0 2px; font-size: 22px; }
  header p { margin: 0; font-size: 13px; color: #666; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end;
    padding: 10px 20px;
  }
  .controls label {
    display: flex; flex-direction: column;
    font-size: 12px; font-weight: 600; gap: 3px;
  }
  .controls input {
    padding: 6px 8px; font-size: 14px;
    border: 1px solid #bbb; border-radius: 6px; width: 100px; background: #fff;
  }
  .controls button {
    padding: 8px 16px; font-size: 14px; font-weight: 700;
    border: none; border-radius: 6px; cursor: pointer;
    background: #2f6f4f; color: #fff;
  }
  .controls input.raised { border: 2px solid var(--wall); }
  .controls button.secondary { background: #666; }
  .controls button:hover { filter: brightness(1.1); }
  .controls button:disabled { background: #aaa; cursor: default; filter: none; }
  #board-wrap { padding: 4px 20px 12px; overflow-x: auto; }
  svg { background: #1c1a22; border: 1px solid #ccc; border-radius: 8px; display: block; }
  .legend {
    display: flex; flex-wrap: wrap; gap: 14px;
    padding: 0 20px 10px; font-size: 13px;
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 16px; height: 16px; border-radius: 3px; display: inline-block; }
  #summary { padding: 0 20px 24px; font-size: 13px; color: #555; max-width: 900px; }
</style>
</head>
<body>
<header>
  <h1>Mall Map Generator</h1>
  <p>Board setup helper. Same seed, same map.</p>
</header>

<div class="controls">
  <label>Seed
    <input type="text" id="seed" value="mall-1">
  </label>
  <label>Halls
    <input type="number" id="numHalls" value="6" min="4" max="40">
  </label>
  <label>Stores
    <input type="number" id="numStores" value="16" min="0" max="26">
  </label>
  <label>Escalators
    <input type="number" id="numEscalators" value="1" min="0" max="8">
  </label>
  <label>Tunnel pairs
    <input type="number" id="numTunnelPairs" value="2" min="0" max="3">
  </label>
  <label style="flex-direction:row;align-items:center;gap:6px;padding-bottom:8px">
    <input type="checkbox" id="lockBigStores" style="width:auto"> Lock large store to plaza
  </label>
  <button id="generate">Generate</button>
  <button id="randomize">Generate new seed</button>
  <button id="starter" class="secondary">Starter mall</button>
  <button id="save" class="secondary">Save</button>
</div>

<div class="legend">
  <span><i style="background:#8f5fae"></i>Plaza 4&times;4</span>
  <span><i style="background:#2e2b3f"></i>Big Store 2&times;4 (start)</span>
  <span><i style="background:#3a3650"></i>Store 2&times;1</span>
  <span><i style="background:#7a5fae"></i>Hallway 2&times;1</span>
  <span><i style="background:#4f2e2e"></i>Security Room 2&times;1</span>
  <span><i style="background:#26232e;border:1px solid #e8a33d"></i>Escalator 2&times;1 (one-way)</span>
  <span><i style="background:#33303e"></i>Tunnel 1&times;1 (paired)</span>
  <span><i style="background:var(--open)"></i>Open edge</span>
  <span><i style="background:var(--wall)"></i>Wall edge</span>
</div>

<div id="board-wrap"></div>
<div id="summary"></div>

<script>
"use strict";

// ---------- seeded random numbers ----------
// FNV-1a hash of the seed text, so any text becomes a number
function hashSeed(text) {
  let hash = 2166136261 >>> 0;
  for (let index = 0; index < text.length; index++) {
    hash ^= text.charCodeAt(index);
    hash = Math.imul(hash, 16777619);
  }
  return hash >>> 0;
}
// mulberry32: a small generator that returns numbers in [0, 1). The same
// seed number always gives the same sequence.
function makeRandom(seedNumber) {
  let state = seedNumber;
  return function () {
    state |= 0;
    state = (state + 0x6D2B79F5) | 0;
    let mixed = Math.imul(state ^ (state >>> 15), 1 | state);
    mixed = (mixed + Math.imul(mixed ^ (mixed >>> 7), 61 | mixed)) ^ mixed;
    return ((mixed ^ (mixed >>> 14)) >>> 0) / 4294967296;
  };
}
function plural(count, word) {
  return count + " " + word + (count === 1 ? "" : "s");
}
// Fisher-Yates shuffle in place, driven by the seeded generator
function shuffle(items, random) {
  for (let index = items.length - 1; index > 0; index--) {
    const swapIndex = Math.floor(random() * (index + 1));
    [items[index], items[swapIndex]] = [items[swapIndex], items[index]];
  }
  return items;
}

// ---------- board model ----------
// The board is a grid of cells. Every piece is a rectangle of cells with
// x, y, width, height, a type, and the sides that are open (blue edges).
const GRID_WIDTH = 24, GRID_HEIGHT = 14, CELL_SIZE = 40;
const ALL_SIDES = ["top", "bottom", "left", "right"];
const OPPOSITE_SIDE = { top: "bottom", bottom: "top", left: "right", right: "left" };
const WALKABLE = ["plaza", "hall", "escalator", "tunnel"];

function makeGrid() {
  const grid = [];
  for (let y = 0; y < GRID_HEIGHT; y++) grid.push(new Array(GRID_WIDTH).fill(null));
  return grid;
}
function inBounds(x, y) {
  return x >= 0 && y >= 0 && x < GRID_WIDTH && y < GRID_HEIGHT;
}
function pieceAt(grid, x, y) {
  return inBounds(x, y) ? grid[y][x] : null;
}
function cellIs(grid, x, y, types) {
  const piece = pieceAt(grid, x, y);
  return !!piece && types.includes(piece.type);
}
function fits(grid, x, y, width, height) {
  if (x < 0 || y < 0 || x + width > GRID_WIDTH || y + height > GRID_HEIGHT) return false;
  for (let row = y; row < y + height; row++)
    for (let column = x; column < x + width; column++)
      if (grid[row][column]) return false;
  return true;
}
function place(grid, pieces, piece) {
  for (let row = piece.y; row < piece.y + piece.height; row++)
    for (let column = piece.x; column < piece.x + piece.width; column++)
      grid[row][column] = piece;
  pieces.push(piece);
  return piece;
}
// the cells just outside one side of a rectangle, as [x, y] pairs
function cellsOutside(rectangle, side) {
  if (side === "top")    return Array.from({ length: rectangle.width }, (_, offset) => [rectangle.x + offset, rectangle.y - 1]);
  if (side === "bottom") return Array.from({ length: rectangle.width }, (_, offset) => [rectangle.x + offset, rectangle.y + rectangle.height]);
  if (side === "left")   return Array.from({ length: rectangle.height }, (_, offset) => [rectangle.x - 1, rectangle.y + offset]);
  return Array.from({ length: rectangle.height }, (_, offset) => [rectangle.x + rectangle.width, rectangle.y + offset]);
}
const longSidesOf = rectangle => rectangle.width > rectangle.height ? ["top", "bottom"] : ["left", "right"];

function generate(seedText, settings) {
  const random = makeRandom(hashSeed(seedText));
  const grid = makeGrid();
  const pieces = [];
  const notes = [];

  // The mall is laid out around a vertical centre line. Structural pieces
  // try to place as mirrored left/right pairs so the map reads symmetric,
  // but a pair degrades to a single piece when the mirror spot is taken:
  // close to symmetric, not rigidly so.
  const mirrorSide = side => side === "left" ? "right" : side === "right" ? "left" : side;
  const mirrorDirection = direction => direction === "left" ? "right" : direction === "right" ? "left" : direction;
  const mirroredX = rectangle => GRID_WIDTH - rectangle.x - rectangle.width;
  function placeMirroredPair(piece) {
    const placed = [place(grid, pieces, piece)];
    const mirrorX = mirroredX(piece);
    if (mirrorX !== piece.x && fits(grid, mirrorX, piece.y, piece.width, piece.height)) {
      placed.push(place(grid, pieces, {
        ...piece,
        x: mirrorX,
        openSides: (piece.openSides || []).map(mirrorSide),
        direction: mirrorDirection(piece.direction),
      }));
    }
    return placed;
  }

  // --- 1. plazas: 4x4, mirrored left/right, 2 or 3 hallways apart ---
  // starter mall: fixed first-game layout (6 halls, big stores top/bottom only)
  const hallsApart = settings.starter || settings.halls >= 6 ? 3 : 2;
  const corridorLength = hallsApart * 2;
  const plazaTop = 5; // rows 5-8
  const leftPlazaX = (GRID_WIDTH - (8 + corridorLength)) / 2;
  const [leftPlaza, rightPlaza] = placeMirroredPair({
    type: "plaza", x: leftPlazaX, y: plazaTop, width: 4, height: 4, openSides: ALL_SIDES, depth: 0,
  });

  // --- 2. two corridors connect the plazas: top row and bottom row ---
  const corridorRows = [plazaTop, plazaTop + 3];
  for (const row of corridorRows) {
    for (let index = 0; index < hallsApart; index++) {
      const x = leftPlaza.x + 4 + index * 2;
      if (grid[row][x]) continue; // already filled by an earlier hall's mirror
      placeMirroredPair({ type: "hall", x, y: row, width: 2, height: 1, openSides: ALL_SIDES, depth: 0 });
    }
  }

  // --- 3. big stores ---
  // starter mall: two per plaza, top and bottom. Otherwise they are placed
  // once the halls exist, see placeBigStores below.
  let bigStoreCount = 0;
  function placeBigStore(spot) {
    bigStoreCount++;
    place(grid, pieces, {
      type: "bigstore", x: spot.x, y: spot.y, width: spot.width, height: spot.height,
      openSides: [spot.side], name: String(bigStoreCount),
    });
  }
  if (settings.starter) {
    for (const plaza of [leftPlaza, rightPlaza]) {
      placeBigStore({ x: plaza.x, y: plaza.y - 2, width: 4, height: 2, side: "bottom" });
      placeBigStore({ x: plaza.x, y: plaza.y + 4, width: 4, height: 2, side: "top" });
    }
  }

  // --- 4. escalators: made by converting halls ---
  // escalators may chain, but a chain all runs one way: a new escalator
  // takes the direction of any escalator it touches, and is skipped when
  // those disagree or run across it
  let escalatorCount = 0;
  // empty cells past a spur escalator's end, kept for a tunnel
  const reservedForTunnels = [];
  // tunnels keep their distance from every other tunnel
  const TUNNEL_SPACING = 6;
  const tooCloseForTunnels = (first, second) =>
    Math.abs(first.x - second.x) + Math.abs(first.y - second.y) < TUNNEL_SPACING;
  const overlapsReserved = rectangle => reservedForTunnels.some(cell =>
    cell.x >= rectangle.x && cell.x < rectangle.x + rectangle.width
    && cell.y >= rectangle.y && cell.y < rectangle.y + rectangle.height);
  const horizontalHalls = () => pieces.filter(piece => piece.type === "hall" && piece.width === 2);
  const neighbourPieces = piece => ALL_SIDES.flatMap(side => cellsOutside(piece, side))
    .map(([cellX, cellY]) => pieceAt(grid, cellX, cellY));
  const touchesPiece = (piece, other) => neighbourPieces(piece).includes(other);
  const runsAlong = (hall, direction) => (hall.width === 2) === (direction === "left" || direction === "right");
  // null: free choice; false: no legal direction; otherwise the required one
  function forcedDirection(hall) {
    const directions = new Set(neighbourPieces(hall)
      .filter(neighbour => neighbour && neighbour.type === "escalator")
      .map(neighbour => neighbour.direction));
    if (!directions.size) return null;
    if (directions.size > 1) return false;
    const [direction] = directions;
    return runsAlong(hall, direction) ? direction : false;
  }
  const randomDirection = hall => hall.width === 2
    ? (random() < 0.5 ? "right" : "left")
    : (random() < 0.5 ? "down" : "up");
  function turnIntoEscalator(hall, direction) {
    hall.type = "escalator";
    hall.direction = direction;
    hall.openSides = hall.width === 2 ? ["left", "right"] : ["top", "bottom"];
  }
  // a mirrored pair runs in opposite directions, so a pair that touches
  // cannot chain; those halls are left to the single pass
  function mirrorPartner(hall) {
    return pieces.find(other => other !== hall && other.type === "hall"
      && other.width === hall.width && other.height === hall.height
      && other.y === hall.y && other.x === mirroredX(hall));
  }
  // corridor pairs mirror across the two corridor rows as well, so the
  // pair makes a loop around the middle instead of a trap in it
  function loopPartner(hall) {
    const otherRow = hall.y === corridorRows[0] ? corridorRows[1] : corridorRows[0];
    return pieces.find(other => other !== hall && other.type === "hall"
      && other.width === 2 && other.y === otherRow && other.x === mirroredX(hall));
  }
  function convertPair(hall, partner, direction) {
    if (touchesPiece(hall, partner)) return false;
    const forcedForHall = forcedDirection(hall);
    const forcedForPartner = forcedDirection(partner);
    if (forcedForHall === false || forcedForPartner === false) return false;
    direction = forcedForHall || (forcedForPartner ? mirrorDirection(forcedForPartner) : direction);
    if (forcedForPartner && forcedForPartner !== mirrorDirection(direction)) return false;
    turnIntoEscalator(hall, direction);
    turnIntoEscalator(partner, mirrorDirection(direction));
    return true;
  }
  for (const hall of shuffle(horizontalHalls(), random)) {
    if (escalatorCount + 2 > settings.escalators) break;
    if (hall.type !== "hall") continue;
    const partner = loopPartner(hall);
    if (partner && convertPair(hall, partner, randomDirection(hall))) escalatorCount += 2;
  }
  for (const hall of shuffle(horizontalHalls(), random)) {
    if (escalatorCount >= settings.escalators) break;
    const forced = forcedDirection(hall);
    if (forced === false) continue;
    turnIntoEscalator(hall, forced || randomDirection(hall));
    escalatorCount++;
  }

  // a big store's door edge is 4 cells long and must sit either on a plaza
  // or across exactly two end-to-end halls, corridor or spur
  function legalBigStoreSpots() {
    const spots = [];
    const seenKeys = new Set();
    const consider = (x, y, width, height, side) => {
      const key = [x, y, width, height, side].join();
      if (seenKeys.has(key)) return;
      seenKeys.add(key);
      if (!fits(grid, x, y, width, height) || overlapsReserved({ x, y, width, height })) return;
      const hosts = cellsOutside({ x, y, width, height }, side)
        .map(([cellX, cellY]) => cellIs(grid, cellX, cellY, ["plaza", "hall"]) ? grid[cellY][cellX] : null);
      if (hosts.includes(null)) return;
      const distinctHosts = new Set(hosts).size;
      const onPlaza = distinctHosts === 1 && hosts[0].type === "plaza";
      const onTwoHalls = !settings.lockBigStores && distinctHosts === 2 && hosts.every(host => host.type === "hall");
      if (onPlaza || onTwoHalls) spots.push({ x, y, width, height, side });
    };
    for (const piece of pieces) {
      if (piece.type !== "plaza" && piece.type !== "hall") continue;
      for (let x = piece.x - 3; x < piece.x + piece.width; x++) {
        consider(x, piece.y - 2, 4, 2, "bottom");
        consider(x, piece.y + piece.height, 4, 2, "top");
      }
      for (let y = piece.y - 3; y < piece.y + piece.height; y++) {
        consider(piece.x - 2, y, 2, 4, "right");
        consider(piece.x + piece.width, y, 2, 4, "left");
      }
    }
    return spots;
  }
  // random spot each time, taking its mirror next when that is legal too.
  // Locked to the plazas, this runs before any spur can take a plaza side;
  // otherwise it waits until the halls and escalators exist.
  function placeBigStores() {
    let attempts = 0;
    while (bigStoreCount < 4 && attempts++ < 20) {
      const spots = shuffle(legalBigStoreSpots(), random);
      if (!spots.length) break;
      const spot = spots[0];
      placeBigStore(spot);
      if (bigStoreCount >= 4) break;
      const mirrorSpot = { x: mirroredX(spot), y: spot.y, width: spot.width, height: spot.height, side: mirrorSide(spot.side) };
      const spotKey = candidate => [candidate.x, candidate.y, candidate.width, candidate.height, candidate.side].join();
      if (legalBigStoreSpots().some(candidate => spotKey(candidate) === spotKey(mirrorSpot))) placeBigStore(mirrorSpot);
    }
    if (bigStoreCount < 4) notes.push("Only " + plural(bigStoreCount, "big store") + " fit.");
  }

  // --- 5. security + stores: 2x1, blue long side flush to hallway or plaza ---
  // every cell of the blue edge must touch a hall or plaza (not an escalator side wall)
  function doorTouchesWalkway(spot) {
    return cellsOutside(spot, spot.side).every(([cellX, cellY]) => cellIs(grid, cellX, cellY, ["hall", "plaza"]));
  }

  function legalStoreSpots() {
    const spots = [];
    for (const piece of pieces) {
      if (piece.type === "hall") {
        if (piece.width === 2) {
          spots.push({ x: piece.x, y: piece.y - 1, width: 2, height: 1, side: "bottom", host: piece });
          spots.push({ x: piece.x, y: piece.y + 1, width: 2, height: 1, side: "top", host: piece });
        } else {
          spots.push({ x: piece.x - 1, y: piece.y, width: 1, height: 2, side: "right", host: piece });
          spots.push({ x: piece.x + 1, y: piece.y, width: 1, height: 2, side: "left", host: piece });
        }
      } else if (piece.type === "plaza") {
        for (let x = piece.x; x <= piece.x + 2; x++) {
          spots.push({ x, y: piece.y - 1, width: 2, height: 1, side: "bottom", host: piece });
          spots.push({ x, y: piece.y + 4, width: 2, height: 1, side: "top", host: piece });
        }
        for (let y = piece.y; y <= piece.y + 2; y++) {
          spots.push({ x: piece.x - 1, y, width: 1, height: 2, side: "right", host: piece });
          spots.push({ x: piece.x + 4, y, width: 1, height: 2, side: "left", host: piece });
        }
      }
    }
    return spots.filter(spot => fits(grid, spot.x, spot.y, spot.width, spot.height)
      && doorTouchesWalkway(spot) && !overlapsReserved(spot));
  }

  // hall-to-hall connection rules:
  //  - never long side to long side
  //  - short-to-long and short-to-short only
  //  - at most one hall may connect along any hall's long side
  //  - a hall meets a plaza with its short end only; lying along the plaza
  //    edge just eats storefronts
  const isHallLike = piece => !!piece && (piece.type === "hall" || piece.type === "escalator");
  function hallPlacementAllowed(candidate) {
    const candidateLongSides = longSidesOf(candidate);
    for (const side of ALL_SIDES) {
      const touching = new Set();
      for (const [cellX, cellY] of cellsOutside(candidate, side)) {
        const neighbour = pieceAt(grid, cellX, cellY);
        if (isHallLike(neighbour)) touching.add(neighbour);
      }
      const onLongSide = candidateLongSides.includes(side);
      if (onLongSide && cellsOutside(candidate, side).some(([cellX, cellY]) => cellIs(grid, cellX, cellY, ["plaza"]))) return false;
      if (!touching.size) continue;
      if (onLongSide && touching.size > 1) return false;
      for (const neighbour of touching) {
        const onNeighbourLongSide = longSidesOf(neighbour).includes(OPPOSITE_SIDE[side]);
        if (onLongSide && onNeighbourLongSide) return false;
        if (onNeighbourLongSide) {
          // the candidate would join the neighbour's long side: that side must be empty of halls
          for (const [cellX, cellY] of cellsOutside(neighbour, OPPOSITE_SIDE[side])) {
            const other = pieceAt(grid, cellX, cellY);
            if (other && other !== neighbour && isHallLike(other)) return false;
          }
        }
      }
    }
    return true;
  }

  // a hall must open onto a hall, plaza, or escalator through an open edge.
  // Returns the depth the hall would sit at (one past its nearest connector),
  // or null when it connects to nothing. The core is depth 0: the plazas and
  // the corridor halls between them, including any turned into escalators.
  const CONNECTORS = ["hall", "plaza", "escalator"];
  function depthIfPlaced(candidate) {
    let depth = null;
    for (const side of ALL_SIDES)
      for (const [cellX, cellY] of cellsOutside(candidate, side)) {
        if (!cellIs(grid, cellX, cellY, CONNECTORS)) continue;
        const neighbour = grid[cellY][cellX];
        if (!(neighbour.openSides || []).includes(OPPOSITE_SIDE[side])) continue;
        if (depth === null || neighbour.depth + 1 < depth) depth = neighbour.depth + 1;
      }
    return depth;
  }

  // grow one hallway spur (mirrored when the mirror spot is free, so the
  // skeleton stays near-symmetric)
  function growSpur(maxHalls) {
    const candidates = [];
    for (const piece of pieces) {
      if (!CONNECTORS.includes(piece.type)) continue;
      for (let x = piece.x; x < piece.x + piece.width; x++) {
        candidates.push({ x, y: piece.y - 2, width: 1, height: 2 });
        candidates.push({ x, y: piece.y + piece.height, width: 1, height: 2 });
      }
      for (let y = piece.y; y < piece.y + piece.height; y++) {
        candidates.push({ x: piece.x - 2, y, width: 2, height: 1 });
        candidates.push({ x: piece.x + piece.width, y, width: 2, height: 1 });
      }
    }
    shuffle(candidates, random);
    for (const candidate of candidates) {
      if (!fits(grid, candidate.x, candidate.y, candidate.width, candidate.height)) continue;
      const depth = depthIfPlaced(candidate);
      if (depth === null || !hallPlacementAllowed(candidate)) continue;
      place(grid, pieces, { type: "hall", ...candidate, openSides: ALL_SIDES, depth });
      // mirror the spur when the mirrored spot is free and also legal
      const mirrorCandidate = { x: mirroredX(candidate), y: candidate.y, width: candidate.width, height: candidate.height };
      const mirrorDepth = depthIfPlaced(mirrorCandidate);
      const roomToMirror = countHalls() < maxHalls;
      if (roomToMirror && mirrorCandidate.x !== candidate.x
          && fits(grid, mirrorCandidate.x, mirrorCandidate.y, mirrorCandidate.width, mirrorCandidate.height)
          && mirrorDepth !== null && hallPlacementAllowed(mirrorCandidate)) {
        place(grid, pieces, { type: "hall", ...mirrorCandidate, openSides: ALL_SIDES, depth: mirrorDepth });
      }
      return true;
    }
    return false;
  }

  const countHalls = () => pieces.filter(isHallLike).length;

  // grow the skeleton to exactly the requested hall count and stop there;
  // the caller raises the count and retries when stores do not fit
  // (starter mall never grows: exactly the 6 corridor halls)
  if (settings.lockBigStores) placeBigStores();
  let growAttempts = 0;
  while (!settings.starter && countHalls() < settings.halls && growAttempts++ < 80) {
    if (!growSpur(settings.halls)) break;
  }

  // more escalators than corridor halls: turn spur halls into escalators,
  // but only ones with nothing hall-like on their long sides, so closing
  // those sides cannot cut a hall off
  const longSidesClear = hall => longSidesOf(hall).every(side =>
    cellsOutside(hall, side).every(([cellX, cellY]) => !cellIs(grid, cellX, cellY, ["hall", "escalator"])));
  // both ends of an escalator must lead somewhere: a hall, plaza, or
  // escalator with an open facing edge, or a tunnel placed later. An empty
  // end cell is reserved for a tunnel while the tunnel budget lasts.
  const openEndsOf = hall => hall.width === 2 ? ["left", "right"] : ["top", "bottom"];
  const tunnelBudget = () => 2 * Math.min(settings.tunnelPairs, 3) - reservedForTunnels.length;
  // "linked" leads somewhere, "free" is an empty cell, "blocked" can never lead anywhere
  function endState(hall, side) {
    const [[cellX, cellY]] = cellsOutside(hall, side);
    if (!inBounds(cellX, cellY)) return "blocked";
    const neighbour = grid[cellY][cellX];
    if (!neighbour) return "free";
    const leadsOn = CONNECTORS.includes(neighbour.type) && (neighbour.openSides || []).includes(OPPOSITE_SIDE[side]);
    return leadsOn ? "linked" : "blocked";
  }
  // number of ends needing a tunnel, or -1 when an end can never lead anywhere
  function endsNeedingTunnel(hall) {
    const states = openEndsOf(hall).map(side => endState(hall, side));
    if (states.includes("blocked")) return -1;
    for (const side of openEndsOf(hall)) {
      if (endState(hall, side) !== "free") continue;
      const [[cellX, cellY]] = cellsOutside(hall, side);
      if (reservedForTunnels.some(cell => tooCloseForTunnels(cell, { x: cellX, y: cellY }))) return -1;
    }
    return states.filter(state => state === "free").length;
  }
  function reserveEnds(hall) {
    for (const side of openEndsOf(hall)) {
      if (endState(hall, side) !== "free") continue;
      const [[cellX, cellY]] = cellsOutside(hall, side);
      reservedForTunnels.push({ x: cellX, y: cellY, side: OPPOSITE_SIDE[side] });
    }
  }
  for (const hall of shuffle(pieces.filter(piece => piece.type === "hall" && piece.depth > 0), random)) {
    if (escalatorCount >= settings.escalators) break;
    if (hall.type !== "hall" || !longSidesClear(hall)) continue;
    const hallFreeEnds = endsNeedingTunnel(hall);
    if (hallFreeEnds < 0 || hallFreeEnds > tunnelBudget()) continue;
    const partner = mirrorPartner(hall);
    const partnerFreeEnds = partner ? endsNeedingTunnel(partner) : -1;
    if (partner && escalatorCount + 2 <= settings.escalators && longSidesClear(partner) && partnerFreeEnds >= 0
        && hallFreeEnds + partnerFreeEnds <= tunnelBudget() && convertPair(hall, partner, randomDirection(hall))) {
      reserveEnds(hall);
      reserveEnds(partner);
      escalatorCount += 2;
      continue;
    }
    const forced = forcedDirection(hall);
    if (forced === false) continue;
    turnIntoEscalator(hall, forced || randomDirection(hall));
    reserveEnds(hall);
    escalatorCount++;
  }

  if (!settings.starter && !settings.lockBigStores) placeBigStores();

  const ROOM_TYPES = ["store", "security", "bigstore"];
  const hasStorefront = hall => ALL_SIDES.some(side =>
    cellsOutside(hall, side).some(([cellX, cellY]) => cellIs(grid, cellX, cellY, ROOM_TYPES)));
  // fill from the core outward; at the same depth a hall with no storefront
  // yet comes before one that already has one
  const storeSpotRank = spot => spot.host.depth * 2 + (spot.host.type === "hall" && !hasStorefront(spot.host) ? 0 : 1);

  let storeCount = 0, securityCount = 0, storeAttempts = 0;
  while ((storeCount < settings.stores || securityCount < 1) && storeAttempts++ < 300) {
    const spots = shuffle(legalStoreSpots(), random).sort((first, second) => storeSpotRank(first) - storeSpotRank(second));
    if (!spots.length) break;
    const spot = spots[0];
    if (securityCount < 1) {
      place(grid, pieces, {
        type: "security", x: spot.x, y: spot.y, width: spot.width, height: spot.height,
        openSides: [spot.side], name: "SECURITY",
      });
      securityCount++;
    } else if (storeCount + 1 < settings.stores) {
      // room for two: mirror the store when the mirrored spot is also legal
      const placed = placeMirroredPair({
        type: "store", x: spot.x, y: spot.y, width: spot.width, height: spot.height, openSides: [spot.side],
      });
      const twin = placed[1];
      if (twin && (overlapsReserved(twin) || !doorTouchesWalkway({ ...twin, side: twin.openSides[0] }))) {
        // mirror landed against something that is not a storefront; undo it
        for (let row = twin.y; row < twin.y + twin.height; row++)
          for (let column = twin.x; column < twin.x + twin.width; column++)
            grid[row][column] = null;
        pieces.splice(pieces.indexOf(twin), 1);
        placed.pop();
      }
      storeCount += placed.length;
    } else {
      place(grid, pieces, {
        type: "store", x: spot.x, y: spot.y, width: spot.width, height: spot.height, openSides: [spot.side],
      });
      storeCount++;
    }
  }
  if (storeCount < settings.stores) notes.push("Board full: placed " + storeCount + " of " + settings.stores + " stores.");
  if (!settings.starter && countHalls() < settings.halls)
    notes.push("Only " + countHalls() + " of " + settings.halls + " halls fit.");

  // every hall must have a storefront on it
  const emptyHalls = pieces.filter(piece => piece.type === "hall" && !hasStorefront(piece)).length;
  if (emptyHalls) notes.push(plural(emptyHalls, "hall") + " with no store.");

  // --- 6. access tunnels: lettered pairs A/B/C, mirrored when possible ---
  const placedTunnels = () => pieces.filter(piece => piece.type === "tunnel");
  // empty cells whose one open edge would face the open edge of a walkable piece
  function tunnelSpots() {
    const spots = [];
    for (let y = 0; y < GRID_HEIGHT; y++)
      for (let x = 0; x < GRID_WIDTH; x++) {
        if (grid[y][x]) continue;
        if (placedTunnels().some(tunnel => tooCloseForTunnels(tunnel, { x, y }))) continue;
        for (const [stepX, stepY, side] of [[1, 0, "right"], [-1, 0, "left"], [0, 1, "bottom"], [0, -1, "top"]]) {
          const neighbourX = x + stepX, neighbourY = y + stepY;
          if (!cellIs(grid, neighbourX, neighbourY, WALKABLE)) continue;
          // the neighbour's facing edge must be open (blue), not a wall
          const neighbour = grid[neighbourY][neighbourX];
          if (!(neighbour.openSides || []).includes(OPPOSITE_SIDE[side])) continue;
          spots.push({ x, y, side });
          break;
        }
      }
    return spots;
  }
  const pairsWanted = Math.min(settings.tunnelPairs, 3);
  let tunnelPairCount = 0;
  const placeTunnel = (spot, label) =>
    place(grid, pieces, { type: "tunnel", x: spot.x, y: spot.y, width: 1, height: 1, openSides: [spot.side], name: label });
  // escalator ends waiting for a tunnel are served before random spots
  const waitingEnds = reservedForTunnels.filter(cell => !grid[cell.y][cell.x]);
  while (tunnelPairCount < pairsWanted) {
    const spots = shuffle(tunnelSpots(), random);
    if (spots.length < 2) break;
    const label = "ABC"[tunnelPairCount];
    const firstSpot = waitingEnds.shift() || spots[0];
    if (placedTunnels().some(tunnel => tooCloseForTunnels(tunnel, firstSpot))) break;
    placeTunnel(firstSpot, label);
    // partner: another waiting escalator end, else the mirrored spot, else
    // any legal spot
    const otherSpots = tunnelSpots();
    const waitingPartner = waitingEnds.find(cell => !placedTunnels().some(tunnel => tooCloseForTunnels(tunnel, cell)));
    const mirrorSpot = otherSpots.find(spot => spot.x === GRID_WIDTH - firstSpot.x - 1 && spot.y === firstSpot.y);
    const partnerSpot = waitingPartner || mirrorSpot || shuffle(otherSpots, random)[0];
    if (!partnerSpot) {
      // no home for the partner; take the first tunnel back off the board
      const orphan = pieces.pop();
      grid[orphan.y][orphan.x] = null;
      break;
    }
    placeTunnel(partnerSpot, label);
    if (waitingPartner) waitingEnds.splice(waitingEnds.indexOf(waitingPartner), 1);
    tunnelPairCount++;
  }

  // escalator ends that still lead nowhere
  const leadsSomewhere = (escalator, side) => {
    const [[cellX, cellY]] = cellsOutside(escalator, side);
    const neighbour = pieceAt(grid, cellX, cellY);
    return !!neighbour && (CONNECTORS.includes(neighbour.type) || neighbour.type === "tunnel")
      && (neighbour.openSides || []).includes(OPPOSITE_SIDE[side]);
  };
  const unusedEscalatorEnds = pieces.filter(piece => piece.type === "escalator")
    .reduce((total, escalator) => total + openEndsOf(escalator).filter(side => !leadsSomewhere(escalator, side)).length, 0);
  if (unusedEscalatorEnds) notes.push(plural(unusedEscalatorEnds, "escalator end") + " leading nowhere.");

  // every room and walkable piece must reach every other, walking
  // escalators only in their arrow direction and tunnels twin to twin
  const WALKABLE_OR_ROOM = ["plaza", "hall", "escalator", "tunnel", "store", "bigstore", "security"];
  const nodes = pieces.filter(piece => WALKABLE_OR_ROOM.includes(piece.type));
  const canLeave = (piece, side) => piece.type !== "escalator" || side === piece.direction;
  const canEnter = (piece, side) => piece.type !== "escalator" || side === OPPOSITE_SIDE[piece.direction];
  const exitsFrom = new Map(nodes.map(node => [node, []]));
  for (const node of nodes) {
    for (const side of node.openSides || []) {
      if (!canLeave(node, side)) continue;
      for (const [cellX, cellY] of cellsOutside(node, side)) {
        const neighbour = pieceAt(grid, cellX, cellY);
        if (!neighbour || neighbour === node || !exitsFrom.has(neighbour)) continue;
        if (!(neighbour.openSides || []).includes(OPPOSITE_SIDE[side]) || !canEnter(neighbour, OPPOSITE_SIDE[side])) continue;
        exitsFrom.get(node).push(neighbour);
      }
    }
    if (node.type === "tunnel") {
      const twin = nodes.find(other => other !== node && other.type === "tunnel" && other.name === node.name);
      if (twin) exitsFrom.get(node).push(twin);
    }
  }
  const entriesInto = new Map(nodes.map(node => [node, []]));
  for (const [node, exits] of exitsFrom) for (const exit of exits) entriesInto.get(exit).push(node);
  function reachableFrom(start, links) {
    const seen = new Set([start]);
    const queue = [start];
    while (queue.length) {
      for (const next of links.get(queue.pop())) {
        if (!seen.has(next)) { seen.add(next); queue.push(next); }
      }
    }
    return seen;
  }
  const forwardReach = reachableFrom(nodes[0], exitsFrom);
  const backwardReach = reachableFrom(nodes[0], entriesInto);
  const stranded = nodes.filter(node => !forwardReach.has(node) || !backwardReach.has(node)).length;
  if (stranded) notes.push("Not every store can reach every other store.");

  return {
    pieces, notes,
    counts: {
      stores: storeCount, security: securityCount, bigStores: bigStoreCount, escalators: escalatorCount,
      tunnelPairs: tunnelPairCount, hallsApart, halls: countHalls(), emptyHalls, unusedEscalatorEnds, stranded,
    },
  };
}

// ---------- rendering: printed-tile look ----------
const FLOOR_COLOURS = {
  plaza: "#8f5fae",
  hall: "#7a5fae",
  escalator: "#26232e",
  store: "#3a3650",
  bigstore: "#2e2b3f",
  security: "#4f2e2e",
  tunnel: "#33303e",
};
const EDGE_THICKNESS = 5; // border strip thickness in px
const OPEN_EDGE_COLOUR = "#3d55c9";
const WALL_EDGE_COLOUR = "#d63c3c";
const RAIL_COLOUR = "#e8a33d";
const BOARD_BACKGROUND = "#1c1a22";

function svgElement(name, attributes) {
  const element = document.createElementNS("http://www.w3.org/2000/svg", name);
  for (const attribute in attributes) element.setAttribute(attribute, attributes[attribute]);
  return element;
}

// pixel-mosaic floor like the printed tiles
function drawMosaic(svg, left, top, width, height, colour, random) {
  const step = 10;
  for (let y = top; y < top + height; y += step)
    for (let x = left; x < left + width; x += step) {
      const shade = (random() - 0.5) * 0.25;
      svg.appendChild(svgElement("rect", {
        x, y, width: Math.min(step, left + width - x), height: Math.min(step, top + height - y),
        fill: colour, opacity: 0.85 + shade,
      }));
    }
}

function render(result, seedText) {
  const random = makeRandom(hashSeed(seedText + ":art"));
  // crop the board to the map with a fixed margin on every side
  const MARGIN = 20;
  let minX = GRID_WIDTH, minY = GRID_HEIGHT, maxX = 0, maxY = 0;
  for (const piece of result.pieces) {
    minX = Math.min(minX, piece.x); minY = Math.min(minY, piece.y);
    maxX = Math.max(maxX, piece.x + piece.width); maxY = Math.max(maxY, piece.y + piece.height);
  }
  const boardWidth = (maxX - minX) * CELL_SIZE + MARGIN * 2;
  const boardHeight = (maxY - minY) * CELL_SIZE + MARGIN * 2;
  const svg = svgElement("svg", {
    width: boardWidth, height: boardHeight,
    viewBox: `${minX * CELL_SIZE - MARGIN} ${minY * CELL_SIZE - MARGIN} ${boardWidth} ${boardHeight}`,
  });

  for (const piece of result.pieces) {
    const left = piece.x * CELL_SIZE, top = piece.y * CELL_SIZE;
    const width = piece.width * CELL_SIZE, height = piece.height * CELL_SIZE;
    const openSides = piece.openSides || [];

    // edge strips: blue = open, red = wall
    const edgeColour = side => openSides.includes(side) ? OPEN_EDGE_COLOUR : WALL_EDGE_COLOUR;
    svg.appendChild(svgElement("rect", { x: left, y: top, width, height: EDGE_THICKNESS, fill: edgeColour("top") }));
    svg.appendChild(svgElement("rect", { x: left, y: top + height - EDGE_THICKNESS, width, height: EDGE_THICKNESS, fill: edgeColour("bottom") }));
    svg.appendChild(svgElement("rect", { x: left, y: top, width: EDGE_THICKNESS, height, fill: edgeColour("left") }));
    svg.appendChild(svgElement("rect", { x: left + width - EDGE_THICKNESS, y: top, width: EDGE_THICKNESS, height, fill: edgeColour("right") }));

    // floor
    drawMosaic(svg, left + EDGE_THICKNESS, top + EDGE_THICKNESS, width - EDGE_THICKNESS * 2, height - EDGE_THICKNESS * 2, FLOOR_COLOURS[piece.type], random);

    // plaza fountain
    if (piece.type === "plaza") {
      const centreX = left + width / 2, centreY = top + height / 2;
      svg.appendChild(svgElement("circle", { cx: centreX, cy: centreY, r: 26, fill: "#b08d57", stroke: "#7a5f38", "stroke-width": 3 }));
      svg.appendChild(svgElement("circle", { cx: centreX, cy: centreY, r: 16, fill: "#3f6b3a" }));
      svg.appendChild(svgElement("circle", { cx: centreX, cy: centreY, r: 7, fill: "#b08d57" }));
    }

    // escalator: orange rails + one-way arrows
    if (piece.type === "escalator") {
      const horizontal = piece.width === 2;
      if (horizontal) {
        svg.appendChild(svgElement("rect", { x: left + EDGE_THICKNESS + 2, y: top + 9, width: width - EDGE_THICKNESS * 2 - 4, height: 3, fill: RAIL_COLOUR }));
        svg.appendChild(svgElement("rect", { x: left + EDGE_THICKNESS + 2, y: top + height - 12, width: width - EDGE_THICKNESS * 2 - 4, height: 3, fill: RAIL_COLOUR }));
      } else {
        svg.appendChild(svgElement("rect", { x: left + 9, y: top + EDGE_THICKNESS + 2, width: 3, height: height - EDGE_THICKNESS * 2 - 4, fill: RAIL_COLOUR }));
        svg.appendChild(svgElement("rect", { x: left + width - 12, y: top + EDGE_THICKNESS + 2, width: 3, height: height - EDGE_THICKNESS * 2 - 4, fill: RAIL_COLOUR }));
      }
      for (const fraction of [0.3, 0.7]) {
        const arrowX = horizontal ? left + width * fraction : left + width / 2;
        const arrowY = horizontal ? top + height / 2 : top + height * fraction;
        const arrowSize = 8;
        let path;
        if (piece.direction === "right") path = `M ${arrowX - arrowSize} ${arrowY - arrowSize} L ${arrowX + arrowSize} ${arrowY} L ${arrowX - arrowSize} ${arrowY + arrowSize} Z`;
        if (piece.direction === "left")  path = `M ${arrowX + arrowSize} ${arrowY - arrowSize} L ${arrowX - arrowSize} ${arrowY} L ${arrowX + arrowSize} ${arrowY + arrowSize} Z`;
        if (piece.direction === "down")  path = `M ${arrowX - arrowSize} ${arrowY - arrowSize} L ${arrowX} ${arrowY + arrowSize} L ${arrowX + arrowSize} ${arrowY - arrowSize} Z`;
        if (piece.direction === "up")    path = `M ${arrowX - arrowSize} ${arrowY + arrowSize} L ${arrowX} ${arrowY - arrowSize} L ${arrowX + arrowSize} ${arrowY + arrowSize} Z`;
        svg.appendChild(svgElement("path", { d: path, fill: "#eee", stroke: "#999", "stroke-width": 1 }));
      }
    }

    // label: big store number, security text, tunnel letter
    if (piece.name) {
      const vertical = piece.height > piece.width && piece.name.length > 2;
      const fontSize = piece.type === "bigstore" ? 26 : piece.type === "tunnel" ? 16 : 9;
      const centreX = left + width / 2, centreY = top + height / 2;
      const label = svgElement("text", {
        x: centreX, y: centreY + fontSize / 3,
        "text-anchor": "middle",
        "font-size": fontSize,
        "font-weight": 700,
        fill: "#f0ede4",
        "font-family": "system-ui, sans-serif",
      });
      if (vertical) label.setAttribute("transform", `rotate(-90 ${centreX} ${centreY})`);
      label.textContent = piece.name;
      svg.appendChild(label);
    }
  }
  return svg;
}

// ---------- wiring ----------
// first-game layout: fixed settings, whatever the boxes say
const STARTER_SETTINGS = { halls: 6, stores: 15, escalators: 0, tunnelPairs: 0, starter: true };
const STORE_LIMIT = 26, ESCALATOR_LIMIT = 8, TUNNEL_PAIR_LIMIT = 3;
// how many redraws to try at one hall count, and how far the count may climb
const REDRAW_LIMIT = 12, HALL_LIMIT = 60;

function run(useStarter) {
  const seed = document.getElementById("seed").value || "mall";
  const hallsBox = document.getElementById("numHalls");
  hallsBox.classList.remove("raised");
  // read a number box, clamp it to its limit, and write the clamped value back
  const readCount = (boxId, limit) => {
    const box = document.getElementById(boxId);
    const value = Math.min(Math.max(0, +box.value || 0), limit);
    box.value = value;
    return value;
  };
  const settings = useStarter ? { ...STARTER_SETTINGS } : {
    halls: Math.max(4, +hallsBox.value || 0),
    stores: readCount("numStores", STORE_LIMIT),
    escalators: readCount("numEscalators", ESCALATOR_LIMIT),
    tunnelPairs: readCount("numTunnelPairs", TUNNEL_PAIR_LIMIT),
    lockBigStores: document.getElementById("lockBigStores").checked,
    starter: false,
  };
  let result;
  if (settings.starter) {
    // starter never grows spurs, so a random arrangement can fall short of
    // the requested count; redraw deterministically until every store fits
    result = generate(seed, settings);
    for (let redraw = 1; redraw < 60 && result.counts.stores < settings.stores; redraw++) {
      result = generate(seed + "~" + redraw, settings);
    }
  } else {
    // the box is a minimum: raise it one hall at a time and retry until the
    // smallest count that fits every store, escalator, and tunnel pair is
    // found. At each count a few redraws are tried, keeping the one with the
    // fewest empty halls.
    const askedHalls = settings.halls;
    let bestFit = null;
    for (let halls = askedHalls; halls <= HALL_LIMIT && !bestFit; halls++) {
      settings.halls = halls;
      for (let redraw = 0; redraw < REDRAW_LIMIT; redraw++) {
        const attempt = generate(redraw ? seed + "~" + redraw : seed, settings);
        result = attempt;
        const counts = attempt.counts;
        const fallsShort = counts.stores < settings.stores || counts.bigStores < 4
          || counts.escalators < settings.escalators || counts.tunnelPairs < settings.tunnelPairs
          || counts.unusedEscalatorEnds > 0 || counts.stranded > 0;
        if (fallsShort) continue;
        if (!bestFit || counts.emptyHalls < bestFit.counts.emptyHalls) bestFit = attempt;
        if (counts.emptyHalls === 0) break;
      }
    }
    if (bestFit) {
      result = bestFit;
      if (settings.halls !== askedHalls) {
        hallsBox.value = settings.halls;
        hallsBox.classList.add("raised");
      }
    }
  }
  const boardWrap = document.getElementById("board-wrap");
  boardWrap.innerHTML = "";
  boardWrap.appendChild(render(result, seed));
  const counts = result.counts;
  let summaryHtml = `<b>Seed:</b> ${seed} &nbsp; 2 plazas (${counts.hallsApart} halls apart), ${plural(counts.halls, "hall")}, ${plural(counts.bigStores, "big store")}, ${plural(counts.stores, "store")}, ${plural(counts.security, "security room")}, ${plural(counts.escalators, "escalator")}, ${plural(counts.tunnelPairs, "tunnel pair")}.`;
  if (result.notes.length) summaryHtml += "<br><b>Notes:</b> " + result.notes.join(" ");
  document.getElementById("summary").innerHTML = summaryHtml;
  // Generate stays off until a setting changes from what is on the board.
  // After the starter mall the boxes describe a different map, so it stays on.
  lastGeneratedSettings = useStarter ? null : settingsSnapshot();
  refreshGenerateButton();
}

const SETTING_BOX_IDS = ["seed", "numHalls", "numStores", "numEscalators", "numTunnelPairs", "lockBigStores"];
const settingsSnapshot = () => SETTING_BOX_IDS.map(boxId => {
  const box = document.getElementById(boxId);
  return box.type === "checkbox" ? box.checked : box.value;
}).join("|");
let lastGeneratedSettings = null;
function refreshGenerateButton() {
  document.getElementById("generate").disabled = lastGeneratedSettings !== null && settingsSnapshot() === lastGeneratedSettings;
}
for (const boxId of SETTING_BOX_IDS) {
  document.getElementById(boxId).addEventListener("input", refreshGenerateButton);
  document.getElementById(boxId).addEventListener("change", refreshGenerateButton);
}

document.getElementById("generate").addEventListener("click", () => run());
document.getElementById("starter").addEventListener("click", () => run(true));
document.getElementById("randomize").addEventListener("click", () => {
  document.getElementById("seed").value = "mall-" + Math.floor(Math.random() * 100000);
  run();
});
document.getElementById("save").addEventListener("click", () => {
  const boardSvg = document.querySelector("#board-wrap svg");
  const seed = document.getElementById("seed").value || "mall";
  const svgUrl = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(boardSvg)], { type: "image/svg+xml" }));
  const image = new Image();
  image.onload = () => {
    const scale = 2;
    const canvas = document.createElement("canvas");
    canvas.width = boardSvg.width.baseVal.value * scale;
    canvas.height = boardSvg.height.baseVal.value * scale;
    const context = canvas.getContext("2d");
    context.fillStyle = BOARD_BACKGROUND;
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.drawImage(image, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(svgUrl);
    const link = document.createElement("a");
    link.download = seed.replace(/[^\w-]+/g, "_") + ".png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  };
  image.src = svgUrl;
});
run(true);
</script>
