<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mall Map Generator</title>
<style>
  :root {
    --bg: #f4f1ea;
    --ink: #2b2b2b;
    --wall: #d63c3c;   /* red edge = wall */
    --open: #3d55c9;   /* blue edge = open / walkable */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header { padding: 14px 20px 6px; }
  header h1 { margin: 0 0 2px; font-size: 22px; }
  header p { margin: 0; font-size: 13px; color: #666; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end;
    padding: 10px 20px;
  }
  .controls label {
    display: flex; flex-direction: column;
    font-size: 12px; font-weight: 600; gap: 3px;
  }
  .controls input {
    padding: 6px 8px; font-size: 14px;
    border: 1px solid #bbb; border-radius: 6px; width: 100px; background: #fff;
  }
  .controls button {
    padding: 8px 16px; font-size: 14px; font-weight: 700;
    border: none; border-radius: 6px; cursor: pointer;
    background: #2f6f4f; color: #fff;
  }
  .controls input.raised { border: 2px solid var(--wall); }
  .controls button.secondary { background: #666; }
  .controls button:hover { filter: brightness(1.1); }
  #board-wrap { padding: 4px 20px 12px; overflow-x: auto; }
  svg { background: #1c1a22; border: 1px solid #ccc; border-radius: 8px; display: block; }
  .legend {
    display: flex; flex-wrap: wrap; gap: 14px;
    padding: 0 20px 10px; font-size: 13px;
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 16px; height: 16px; border-radius: 3px; display: inline-block; }
  #summary { padding: 0 20px 24px; font-size: 13px; color: #555; max-width: 900px; }
</style>
</head>
<body>
<header>
  <h1>Mall Map Generator</h1>
  <p>Board setup helper. Same seed, same map.</p>
</header>

<div class="controls">
  <label>Seed
    <input type="text" id="seed" value="mall-1">
  </label>
  <label>Halls
    <input type="number" id="numHalls" value="6" min="4" max="40">
  </label>
  <label>Stores
    <input type="number" id="numStores" value="16" min="0" max="26">
  </label>
  <label>Escalators
    <input type="number" id="numEscalators" value="1" min="0" max="8">
  </label>
  <label>Tunnel pairs
    <input type="number" id="numTunnelPairs" value="2" min="0" max="3">
  </label>
  <button id="generate">Generate</button>
  <button id="randomize" class="secondary">Random seed</button>
  <button id="starter" class="secondary">Starter mall</button>
  <button id="save" class="secondary">Save</button>
</div>

<div class="legend">
  <span><i style="background:#8f5fae"></i>Plaza 4&times;4</span>
  <span><i style="background:#2e2b3f"></i>Big Store 2&times;4 (start)</span>
  <span><i style="background:#3a3650"></i>Store 2&times;1</span>
  <span><i style="background:#7a5fae"></i>Hallway 2&times;1</span>
  <span><i style="background:#4f2e2e"></i>Security Room 2&times;1</span>
  <span><i style="background:#26232e;border:1px solid #e8a33d"></i>Escalator 2&times;1 (one-way)</span>
  <span><i style="background:#33303e"></i>Tunnel 1&times;1 (paired)</span>
  <span><i style="background:var(--open)"></i>Open edge</span>
  <span><i style="background:var(--wall)"></i>Wall edge</span>
</div>

<div id="board-wrap"></div>
<div id="summary"></div>

<script>
"use strict";

// ---------- seeded RNG ----------
function hashSeed(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function plural(n, word) {
  return n + " " + word + (n === 1 ? "" : "s");
}
function shuffle(arr, rnd) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ---------- board model ----------
const GW = 24, GH = 14, CELL = 40;

function makeGrid() {
  const g = [];
  for (let y = 0; y < GH; y++) g.push(new Array(GW).fill(null));
  return g;
}
function fits(grid, x, y, w, h) {
  if (x < 0 || y < 0 || x + w > GW || y + h > GH) return false;
  for (let yy = y; yy < y + h; yy++)
    for (let xx = x; xx < x + w; xx++)
      if (grid[yy][xx]) return false;
  return true;
}
function place(grid, pieces, piece) {
  for (let yy = piece.y; yy < piece.y + piece.h; yy++)
    for (let xx = piece.x; xx < piece.x + piece.w; xx++)
      grid[yy][xx] = piece;
  pieces.push(piece);
  return piece;
}
function cellIs(grid, x, y, types) {
  if (x < 0 || y < 0 || x >= GW || y >= GH) return false;
  const p = grid[y][x];
  return !!p && types.includes(p.type);
}

const WALKABLE = ["plaza", "hall", "escalator", "tunnel"];
const ALL_OPEN = ["top", "bottom", "left", "right"];

function generate(seedStr, opts) {
  const rnd = mulberry32(hashSeed(seedStr));
  const grid = makeGrid();
  const pieces = [];
  const notes = [];

  // The mall is laid out around a vertical center line. Structural pieces
  // try to place as mirrored left/right pairs so the map reads symmetric,
  // but a pair degrades to a single piece when the mirror spot is taken --
  // close to symmetric, not rigidly so.
  const OPPOSITE = { top: "bottom", bottom: "top", left: "right", right: "left" };
  const mirrorSideName = s => s === "left" ? "right" : s === "right" ? "left" : s;
  const mirrorDirName = d => d === "left" ? "right" : d === "right" ? "left" : d;
  const mirrorX = p => GW - p.x - p.w;
  function placePair(piece) {
    const out = [place(grid, pieces, piece)];
    const mx = mirrorX(piece);
    if (mx !== piece.x && fits(grid, mx, piece.y, piece.w, piece.h)) {
      out.push(place(grid, pieces, {
        ...piece,
        x: mx,
        openSides: (piece.openSides || []).map(mirrorSideName),
        dir: mirrorDirName(piece.dir),
      }));
    }
    return out;
  }

  // --- 1. plazas: 4x4, mirrored left/right, no more than 3 hallways apart ---
  // starter mall: fixed first-game layout (6 halls, big stores top/bottom only)
  const hallsApart = opts.starter || opts.halls >= 6 ? 3 : 2;
  const gap = hallsApart * 2;
  const plazaY = 5; // rows 5-8
  const startX = (GW - (8 + gap)) / 2;
  const [plazaL, plazaR] = placePair({ type: "plaza", x: startX, y: plazaY, w: 4, h: 4, openSides: ALL_OPEN, depth: 0 });

  // --- 2. two corridors connect the plazas: top row and bottom row ---
  const corridorRows = [plazaY, plazaY + 3];
  for (const row of corridorRows) {
    for (let i = 0; i < hallsApart; i++) {
      const x = plazaL.x + 4 + i * 2;
      if (grid[row][x]) continue; // already filled by an earlier tile's mirror
      placePair({ type: "hall", x, y: row, w: 2, h: 1, openSides: ALL_OPEN, depth: 0 });
    }
  }

  // --- 3. big stores: 2 per plaza, independent per side (top/bottom/outer) ---
  let playerNum = 1;
  for (const plaza of [plazaL, plazaR]) {
    const isLeft = plaza === plazaL;
    const spotChoices = [
      { x: plaza.x, y: plaza.y - 2, w: 4, h: 2, side: "bottom" },
      { x: plaza.x, y: plaza.y + 4, w: 4, h: 2, side: "top" },
    ];
    if (!opts.starter) spotChoices.push(
      { x: isLeft ? plaza.x - 2 : plaza.x + 4, y: plaza.y, w: 2, h: 4, side: isLeft ? "right" : "left" }
    );
    const spots = shuffle(spotChoices, rnd);
    let placed = 0;
    for (const s of spots) {
      if (placed >= 2) break;
      if (fits(grid, s.x, s.y, s.w, s.h)) {
        place(grid, pieces, {
          type: "bigstore", x: s.x, y: s.y, w: s.w, h: s.h,
          openSides: [s.side],
          name: String(playerNum),
        });
        playerNum++;
        placed++;
      }
    }
    if (placed < 2) notes.push("Only one big store fit on a plaza.");
  }

  // --- 4. escalators: prefer converting mirrored hallway pairs ---
  // escalators may chain, but a chain all runs one way: a new escalator
  // takes the direction of any escalator it touches, and is skipped when
  // those disagree or run across it
  let esc = 0;
  // empty cells past a spur escalator's end, kept for a tunnel
  const reservedForTunnels = [];
  const overlapsReserved = r => reservedForTunnels.some(t =>
    t.x >= r.x && t.x < r.x + r.w && t.y >= r.y && t.y < r.y + r.h);
  const halls = () => pieces.filter(p => p.type === "hall" && p.w === 2);
  const neighbours = h => ALL_OPEN.flatMap(side => sideCells(h, side))
    .map(([cx, cy]) => (cx < 0 || cy < 0 || cx >= GW || cy >= GH) ? null : grid[cy][cx]);
  const touchesPiece = (h, other) => neighbours(h).includes(other);
  const runsAlong = (h, dir) => (h.w === 2) === (dir === "left" || dir === "right");
  // null: free choice; false: no legal direction; otherwise the required one
  function forcedDir(h) {
    const dirs = new Set(neighbours(h).filter(n => n && n.type === "escalator").map(n => n.dir));
    if (!dirs.size) return null;
    if (dirs.size > 1) return false;
    const [dir] = dirs;
    return runsAlong(h, dir) ? dir : false;
  }
  const randomDir = h => h.w === 2 ? (rnd() < 0.5 ? "right" : "left") : (rnd() < 0.5 ? "down" : "up");
  function toEscalator(h, dir) {
    h.type = "escalator";
    h.dir = dir;
    h.openSides = h.w === 2 ? ["left", "right"] : ["top", "bottom"];
  }
  // a mirrored pair runs in opposite directions, so a pair that touches
  // cannot chain; those halls are left to the single pass
  function mirrorPair(h) {
    return pieces.find(p => p !== h && p.type === "hall" && p.w === h.w && p.h === h.h && p.y === h.y && p.x === mirrorX(h));
  }
  function convertPair(h, m, dir) {
    if (touchesPiece(h, m)) return false;
    const fh = forcedDir(h), fm = forcedDir(m);
    if (fh === false || fm === false) return false;
    dir = fh || (fm ? mirrorDirName(fm) : dir);
    if (fm && fm !== mirrorDirName(dir)) return false;
    toEscalator(h, dir);
    toEscalator(m, mirrorDirName(dir));
    return true;
  }
  for (const h of shuffle(halls(), rnd)) {
    if (esc + 2 > opts.escalators) break;
    if (h.type !== "hall") continue;
    const m = mirrorPair(h);
    if (m && convertPair(h, m, randomDir(h))) esc += 2;
  }
  for (const h of shuffle(halls(), rnd)) {
    if (esc >= opts.escalators) break;
    const forced = forcedDir(h);
    if (forced === false) continue;
    toEscalator(h, forced || randomDir(h));
    esc++;
  }

  // --- 5. security + stores: 2x1, blue long side flush to hallway or plaza ---
  function doorTouches(s) {
    // every cell of the blue edge must touch hallway or plaza (not an escalator side wall)
    const t = ["hall", "plaza"];
    if (s.side === "bottom") return cellIs(grid, s.x, s.y + 1, t) && cellIs(grid, s.x + 1, s.y + 1, t);
    if (s.side === "top")    return cellIs(grid, s.x, s.y - 1, t) && cellIs(grid, s.x + 1, s.y - 1, t);
    if (s.side === "right")  return cellIs(grid, s.x + 1, s.y, t) && cellIs(grid, s.x + 1, s.y + 1, t);
    if (s.side === "left")   return cellIs(grid, s.x - 1, s.y, t) && cellIs(grid, s.x - 1, s.y + 1, t);
    return false;
  }

  function legalStoreSpots() {
    const spots = [];
    for (const pc of pieces) {
      if (pc.type === "hall") {
        if (pc.w === 2) {
          spots.push({ x: pc.x, y: pc.y - 1, w: 2, h: 1, side: "bottom", host: pc });
          spots.push({ x: pc.x, y: pc.y + 1, w: 2, h: 1, side: "top", host: pc });
        } else {
          spots.push({ x: pc.x - 1, y: pc.y, w: 1, h: 2, side: "right", host: pc });
          spots.push({ x: pc.x + 1, y: pc.y, w: 1, h: 2, side: "left", host: pc });
        }
      } else if (pc.type === "plaza") {
        for (let x = pc.x; x <= pc.x + 2; x++) {
          spots.push({ x, y: pc.y - 1, w: 2, h: 1, side: "bottom", host: pc });
          spots.push({ x, y: pc.y + 4, w: 2, h: 1, side: "top", host: pc });
        }
        for (let y = pc.y; y <= pc.y + 2; y++) {
          spots.push({ x: pc.x - 1, y, w: 1, h: 2, side: "right", host: pc });
          spots.push({ x: pc.x + 4, y, w: 1, h: 2, side: "left", host: pc });
        }
      }
    }
    return spots.filter(s => fits(grid, s.x, s.y, s.w, s.h) && doorTouches(s) && !overlapsReserved(s));
  }

  // hall-to-hall connection rules:
  //  - never long side to long side
  //  - short-to-long and short-to-short only
  //  - at most one hall may connect along any hall's long side
  //  - a hall meets a plaza with its short end only; lying along the plaza
  //    edge just eats storefronts
  const isHallLike = p => !!p && (p.type === "hall" || p.type === "escalator");
  function sideCells(r, side) {
    if (side === "top")    return Array.from({ length: r.w }, (_, i) => [r.x + i, r.y - 1]);
    if (side === "bottom") return Array.from({ length: r.w }, (_, i) => [r.x + i, r.y + r.h]);
    if (side === "left")   return Array.from({ length: r.h }, (_, i) => [r.x - 1, r.y + i]);
    return Array.from({ length: r.h }, (_, i) => [r.x + r.w, r.y + i]);
  }
  const longSidesOf = r => r.w > r.h ? ["top", "bottom"] : ["left", "right"];
  function hallPlacementOK(cand) {
    const longH = longSidesOf(cand);
    for (const side of ALL_OPEN) {
      const touching = new Set();
      for (const [cx, cy] of sideCells(cand, side)) {
        if (cx < 0 || cy < 0 || cx >= GW || cy >= GH) continue;
        if (isHallLike(grid[cy][cx])) touching.add(grid[cy][cx]);
      }
      const isLongH = longH.includes(side);
      if (isLongH && sideCells(cand, side).some(([cx, cy]) => cellIs(grid, cx, cy, ["plaza"]))) return false;
      if (!touching.size) continue;
      if (isLongH && touching.size > 1) return false;
      for (const n of touching) {
        const isLongN = longSidesOf(n).includes(OPPOSITE[side]);
        if (isLongH && isLongN) return false;
        if (isLongN) {
          // the candidate would join n's long side: that side must be empty of halls
          for (const [cx, cy] of sideCells(n, OPPOSITE[side])) {
            if (cx < 0 || cy < 0 || cx >= GW || cy >= GH) continue;
            const o = grid[cy][cx];
            if (o && o !== n && isHallLike(o)) return false;
          }
        }
      }
    }
    return true;
  }

  // a hall must open onto a hall, plaza, or escalator through an open edge.
  // Returns the depth the hall would sit at (one past its nearest connector),
  // or null when it connects to nothing. The core is depth 0: the plazas and
  // the corridor halls between them, including any turned into escalators.
  const CONNECTORS = ["hall", "plaza", "escalator"];
  function spurDepth(cand) {
    let depth = null;
    for (const side of ALL_OPEN)
      for (const [cx, cy] of sideCells(cand, side)) {
        if (!cellIs(grid, cx, cy, CONNECTORS)) continue;
        const n = grid[cy][cx];
        if (!(n.openSides || []).includes(OPPOSITE[side])) continue;
        if (depth === null || n.depth + 1 < depth) depth = n.depth + 1;
      }
    return depth;
  }

  // grow a hallway spur (mirrored when the mirror spot is free, so the
  // skeleton stays near-symmetric)
  function addSpur(maxHalls) {
    const cands = [];
    for (const pc of pieces) {
      if (!CONNECTORS.includes(pc.type)) continue;
      for (let x = pc.x; x < pc.x + pc.w; x++) {
        cands.push({ x, y: pc.y - 2, w: 1, h: 2 });
        cands.push({ x, y: pc.y + pc.h, w: 1, h: 2 });
      }
      for (let y = pc.y; y < pc.y + pc.h; y++) {
        cands.push({ x: pc.x - 2, y, w: 2, h: 1 });
        cands.push({ x: pc.x + pc.w, y, w: 2, h: 1 });
      }
    }
    shuffle(cands, rnd);
    for (const c of cands) {
      if (!fits(grid, c.x, c.y, c.w, c.h)) continue;
      const depth = spurDepth(c);
      if (depth === null || !hallPlacementOK(c)) continue;
      place(grid, pieces, { type: "hall", x: c.x, y: c.y, w: c.w, h: c.h, openSides: ALL_OPEN, depth });
      // mirror the spur when the mirrored spot is free and also legal
      const m = { x: mirrorX(c), y: c.y, w: c.w, h: c.h };
      const mirrorDepth = spurDepth(m);
      const roomToMirror = hallCount() < maxHalls;
      if (roomToMirror && m.x !== c.x && fits(grid, m.x, m.y, m.w, m.h) && mirrorDepth !== null && hallPlacementOK(m)) {
        place(grid, pieces, { type: "hall", x: m.x, y: m.y, w: m.w, h: m.h, openSides: ALL_OPEN, depth: mirrorDepth });
      }
      return true;
    }
    return false;
  }

  const hallCount = () => pieces.filter(isHallLike).length;

  // grow the skeleton to exactly the requested hall count and stop there;
  // the caller raises the count and retries when stores do not fit
  // (starter mall never grows: exactly the 6 corridor halls)
  let growGuard = 0;
  while (!opts.starter && hallCount() < opts.halls && growGuard++ < 80) {
    if (!addSpur(opts.halls)) break;
  }

  // more escalators than corridor halls: turn spur halls into escalators,
  // but only ones with nothing hall-like on their long sides, so closing
  // those sides cannot cut a hall off
  const longSidesClear = h => longSidesOf(h).every(side =>
    sideCells(h, side).every(([cx, cy]) => !cellIs(grid, cx, cy, ["hall", "escalator"])));
  // both ends of an escalator must lead somewhere: a hall, plaza, or
  // escalator with an open facing edge, or a tunnel placed later. An empty
  // end cell is reserved for a tunnel while the tunnel budget lasts.
  const endsOf = h => h.w === 2 ? ["left", "right"] : ["top", "bottom"];
  const tunnelBudget = () => 2 * Math.min(opts.tunnelPairs, 3) - reservedForTunnels.length;
  function endState(h, side) {
    const [[cx, cy]] = sideCells(h, side);
    if (cx < 0 || cy < 0 || cx >= GW || cy >= GH) return "blocked";
    const n = grid[cy][cx];
    if (!n) return "free";
    return CONNECTORS.includes(n.type) && (n.openSides || []).includes(OPPOSITE[side]) ? "linked" : "blocked";
  }
  // number of ends needing a tunnel, or -1 when an end can never lead anywhere
  function freeEnds(h) {
    const states = endsOf(h).map(side => endState(h, side));
    return states.includes("blocked") ? -1 : states.filter(st => st === "free").length;
  }
  function reserveEnds(h) {
    for (const side of endsOf(h)) {
      if (endState(h, side) !== "free") continue;
      const [[cx, cy]] = sideCells(h, side);
      reservedForTunnels.push({ x: cx, y: cy, side: OPPOSITE[side] });
    }
  }
  for (const h of shuffle(pieces.filter(p => p.type === "hall" && p.depth > 0), rnd)) {
    if (esc >= opts.escalators) break;
    if (h.type !== "hall" || !longSidesClear(h)) continue;
    const freeH = freeEnds(h);
    if (freeH < 0 || freeH > tunnelBudget()) continue;
    const m = mirrorPair(h);
    const freeM = m ? freeEnds(m) : -1;
    if (m && esc + 2 <= opts.escalators && longSidesClear(m) && freeM >= 0
        && freeH + freeM <= tunnelBudget() && convertPair(h, m, randomDir(h))) {
      reserveEnds(h);
      reserveEnds(m);
      esc += 2;
      continue;
    }
    const forced = forcedDir(h);
    if (forced === false) continue;
    toEscalator(h, forced || randomDir(h));
    reserveEnds(h);
    esc++;
  }

  const ROOMS = ["store", "security"];
  const hasRoom = h => ALL_OPEN.some(side =>
    sideCells(h, side).some(([cx, cy]) => cellIs(grid, cx, cy, ROOMS)));
  // fill from the core outward; at the same depth a hall with no storefront
  // yet comes before one that already has one
  const spotRank = s => s.host.depth * 2 + (s.host.type === "hall" && !hasRoom(s.host) ? 0 : 1);

  let stores = 0, security = 0, guard = 0;
  while ((stores < opts.stores || security < 1) && guard++ < 300) {
    const spots = shuffle(legalStoreSpots(), rnd).sort((a, b) => spotRank(a) - spotRank(b));
    if (!spots.length) break;
    const s = spots[0];
    if (security < 1) {
      place(grid, pieces, { type: "security", x: s.x, y: s.y, w: s.w, h: s.h, openSides: [s.side], name: "SECURITY" });
      security++;
    } else if (stores + 1 < opts.stores) {
      // room for two: mirror the store when the mirrored spot is also legal
      const placed = placePair({ type: "store", x: s.x, y: s.y, w: s.w, h: s.h, openSides: [s.side] });
      const twin = placed[1];
      if (twin && (overlapsReserved(twin) || !doorTouches({ x: twin.x, y: twin.y, w: twin.w, h: twin.h, side: twin.openSides[0] }))) {
        // mirror landed against something that is not a storefront; undo it
        for (let yy = twin.y; yy < twin.y + twin.h; yy++)
          for (let xx = twin.x; xx < twin.x + twin.w; xx++)
            grid[yy][xx] = null;
        pieces.splice(pieces.indexOf(twin), 1);
        placed.pop();
      }
      stores += placed.length;
    } else {
      place(grid, pieces, { type: "store", x: s.x, y: s.y, w: s.w, h: s.h, openSides: [s.side] });
      stores++;
    }
  }
  if (stores < opts.stores) notes.push("Board full: placed " + stores + " of " + opts.stores + " stores.");
  if (!opts.starter && hallCount() < opts.halls)
    notes.push("Only " + hallCount() + " of " + opts.halls + " halls fit.");

  // every hall must have a storefront on it
  const emptyHalls = pieces.filter(p => p.type === "hall" && !hasRoom(p)).length;
  if (emptyHalls) notes.push(plural(emptyHalls, "hall") + " with no store.");

  // --- 6. access tunnels: lettered pairs A/B/C, mirrored when possible ---
  function tunnelSpotsNow() {
    const spots = [];
    for (let y = 0; y < GH; y++)
      for (let x = 0; x < GW; x++) {
        if (grid[y][x]) continue;
        for (const [dx, dy, side] of [[1,0,"right"],[-1,0,"left"],[0,1,"bottom"],[0,-1,"top"]]) {
          const nx = x + dx, ny = y + dy;
          if (!cellIs(grid, nx, ny, WALKABLE)) continue;
          // the neighbor's facing edge must be open (blue), not a wall
          const n = grid[ny][nx];
          if (!(n.openSides || []).includes(OPPOSITE[side])) continue;
          spots.push({ x, y, side });
          break;
        }
      }
    return spots;
  }
  const pairsWanted = Math.min(opts.tunnelPairs, 3);
  let tunnelPairs = 0;
  const placeTunnel = (t, label) =>
    place(grid, pieces, { type: "tunnel", x: t.x, y: t.y, w: 1, h: 1, openSides: [t.side], name: label });
  // escalator ends waiting for a tunnel are served before random spots
  const required = reservedForTunnels.filter(t => !grid[t.y][t.x]);
  while (tunnelPairs < pairsWanted) {
    const spots = shuffle(tunnelSpotsNow(), rnd);
    if (spots.length < 2) break;
    const label = "ABC"[tunnelPairs];
    const a = required.shift() || spots[0];
    placeTunnel(a, label);
    // partner: another waiting escalator end, else the mirrored spot, else
    // any legal spot, but never right next to its twin
    const farEnough = t => Math.abs(t.x - a.x) + Math.abs(t.y - a.y) > 4;
    const rest = tunnelSpotsNow().filter(farEnough);
    const waiting = required.find(farEnough);
    const mirror = rest.find(t => t.x === GW - a.x - 1 && t.y === a.y);
    const b = waiting || mirror || shuffle(rest, rnd)[0];
    if (!b) {
      // no home for the partner; take the first tunnel back off the board
      const orphan = pieces.pop();
      grid[orphan.y][orphan.x] = null;
      break;
    }
    placeTunnel(b, label);
    if (waiting) required.splice(required.indexOf(waiting), 1);
    tunnelPairs++;
  }

  // escalator ends that still lead nowhere
  const leadsSomewhere = (e, side) => {
    const [[cx, cy]] = sideCells(e, side);
    if (cx < 0 || cy < 0 || cx >= GW || cy >= GH) return false;
    const n = grid[cy][cx];
    return !!n && (CONNECTORS.includes(n.type) || n.type === "tunnel") && (n.openSides || []).includes(OPPOSITE[side]);
  };
  const unusedEscalatorEnds = pieces.filter(p => p.type === "escalator")
    .reduce((n, e) => n + endsOf(e).filter(side => !leadsSomewhere(e, side)).length, 0);
  if (unusedEscalatorEnds) notes.push(plural(unusedEscalatorEnds, "escalator end") + " leading nowhere.");

  return { pieces, notes, counts: { stores, security, escalators: esc, tunnelPairs, hallsApart, halls: hallCount(), emptyHalls, unusedEscalatorEnds } };
}

// ---------- rendering: printed-tile look ----------
const FLOORS = {
  plaza: "#8f5fae",
  hall: "#7a5fae",
  escalator: "#26232e",
  store: "#3a3650",
  bigstore: "#2e2b3f",
  security: "#4f2e2e",
  tunnel: "#33303e",
};
const EDGE = 5; // border strip thickness in px
const BOARD_BG = "#1c1a22";

function svgEl(name, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", name);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

function drawMosaic(svg, px, py, pw, ph, base, rnd) {
  // pixel-mosaic floor like the printed tiles
  const step = 10;
  for (let y = py; y < py + ph; y += step)
    for (let x = px; x < px + pw; x += step) {
      const v = (rnd() - 0.5) * 0.25;
      svg.appendChild(svgEl("rect", {
        x, y, width: Math.min(step, px + pw - x), height: Math.min(step, py + ph - y),
        fill: base, opacity: 0.85 + v,
      }));
    }
}

function render(result, seedStr) {
  const rnd = mulberry32(hashSeed(seedStr + ":art"));
  // crop the board to the map with a fixed margin on every side
  const PAD = 20;
  let minX = GW, minY = GH, maxX = 0, maxY = 0;
  for (const p of result.pieces) {
    minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
    maxX = Math.max(maxX, p.x + p.w); maxY = Math.max(maxY, p.y + p.h);
  }
  const width = (maxX - minX) * CELL + PAD * 2;
  const height = (maxY - minY) * CELL + PAD * 2;
  const svg = svgEl("svg", {
    width, height,
    viewBox: `${minX * CELL - PAD} ${minY * CELL - PAD} ${width} ${height}`,
  });

  for (const p of result.pieces) {
    const px = p.x * CELL, py = p.y * CELL, pw = p.w * CELL, ph = p.h * CELL;
    const open = p.openSides || [];

    // edge strips: blue = open, red = wall
    const sideColor = s => open.includes(s) ? "#3d55c9" : "#d63c3c";
    svg.appendChild(svgEl("rect", { x: px, y: py, width: pw, height: EDGE, fill: sideColor("top") }));
    svg.appendChild(svgEl("rect", { x: px, y: py + ph - EDGE, width: pw, height: EDGE, fill: sideColor("bottom") }));
    svg.appendChild(svgEl("rect", { x: px, y: py, width: EDGE, height: ph, fill: sideColor("left") }));
    svg.appendChild(svgEl("rect", { x: px + pw - EDGE, y: py, width: EDGE, height: ph, fill: sideColor("right") }));

    // floor
    drawMosaic(svg, px + EDGE, py + EDGE, pw - EDGE * 2, ph - EDGE * 2, FLOORS[p.type], rnd);

    // plaza fountain
    if (p.type === "plaza") {
      const cx = px + pw / 2, cy = py + ph / 2;
      svg.appendChild(svgEl("circle", { cx, cy, r: 26, fill: "#b08d57", stroke: "#7a5f38", "stroke-width": 3 }));
      svg.appendChild(svgEl("circle", { cx, cy, r: 16, fill: "#3f6b3a" }));
      svg.appendChild(svgEl("circle", { cx, cy, r: 7, fill: "#b08d57" }));
    }

    // escalator: orange rails + one-way arrows
    if (p.type === "escalator") {
      const horiz = p.w === 2;
      if (horiz) {
        svg.appendChild(svgEl("rect", { x: px + EDGE + 2, y: py + 9, width: pw - EDGE * 2 - 4, height: 3, fill: "#e8a33d" }));
        svg.appendChild(svgEl("rect", { x: px + EDGE + 2, y: py + ph - 12, width: pw - EDGE * 2 - 4, height: 3, fill: "#e8a33d" }));
      } else {
        svg.appendChild(svgEl("rect", { x: px + 9, y: py + EDGE + 2, width: 3, height: ph - EDGE * 2 - 4, fill: "#e8a33d" }));
        svg.appendChild(svgEl("rect", { x: px + pw - 12, y: py + EDGE + 2, width: 3, height: ph - EDGE * 2 - 4, fill: "#e8a33d" }));
      }
      for (const f of [0.3, 0.7]) {
        const cx = horiz ? px + pw * f : px + pw / 2;
        const cy = horiz ? py + ph / 2 : py + ph * f;
        const s = 8;
        let d;
        if (p.dir === "right") d = `M ${cx - s} ${cy - s} L ${cx + s} ${cy} L ${cx - s} ${cy + s} Z`;
        if (p.dir === "left")  d = `M ${cx + s} ${cy - s} L ${cx - s} ${cy} L ${cx + s} ${cy + s} Z`;
        if (p.dir === "down")  d = `M ${cx - s} ${cy - s} L ${cx} ${cy + s} L ${cx + s} ${cy - s} Z`;
        if (p.dir === "up")    d = `M ${cx - s} ${cy + s} L ${cx} ${cy - s} L ${cx + s} ${cy + s} Z`;
        svg.appendChild(svgEl("path", { d, fill: "#eee", stroke: "#999", "stroke-width": 1 }));
      }
    }

    // label: big store number, security text, tunnel letter
    if (p.name) {
      const vertical = p.h > p.w && p.name.length > 2;
      const fontSize = p.type === "bigstore" ? 26 : p.type === "tunnel" ? 16 : 9;
      const cx = px + pw / 2, cy = py + ph / 2;
      const t = svgEl("text", {
        x: cx, y: cy + fontSize / 3,
        "text-anchor": "middle",
        "font-size": fontSize,
        "font-weight": 700,
        fill: "#f0ede4",
        "font-family": "system-ui, sans-serif",
      });
      if (vertical) t.setAttribute("transform", `rotate(-90 ${cx} ${cy})`);
      t.textContent = p.name;
      svg.appendChild(t);
    }
  }
  return svg;
}

// ---------- wiring ----------
// first-game layout: fixed settings, whatever the boxes say
const STARTER = { halls: 6, stores: 15, escalators: 0, tunnelPairs: 0, starter: true };

function run(starter) {
  const seed = document.getElementById("seed").value || "mall";
  const hallsBox = document.getElementById("numHalls");
  hallsBox.classList.remove("raised");
  const readCount = (id, max) => {
    const box = document.getElementById(id);
    const value = Math.min(Math.max(0, +box.value || 0), max);
    box.value = value;
    return value;
  };
  const opts = starter ? { ...STARTER } : {
    halls: Math.max(4, +hallsBox.value || 0),
    stores: readCount("numStores", 26),
    escalators: readCount("numEscalators", 8),
    tunnelPairs: readCount("numTunnelPairs", 3),
    starter: false,
  };
  let result;
  if (opts.starter) {
    // starter never grows spurs, so a random arrangement can fall short of
    // the requested count; redraw deterministically until every store fits
    result = generate(seed, opts);
    for (let k = 1; k < 60 && result.counts.stores < opts.stores; k++) {
      result = generate(seed + "~" + k, opts);
    }
  } else {
    // the box is a minimum: raise it one hall at a time and retry until the
    // smallest count that fits every store, escalator, and tunnel pair is
    // found. At each count a few redraws are tried, keeping the one with the
    // fewest empty halls.
    const askedHalls = opts.halls;
    const REDRAWS = 12, MAX_HALLS = 60;
    let fitting = null;
    for (let halls = askedHalls; halls <= MAX_HALLS && !fitting; halls++) {
      opts.halls = halls;
      for (let k = 0; k < REDRAWS; k++) {
        const r = generate(k ? seed + "~" + k : seed, opts);
        result = r;
        const short = r.counts.stores < opts.stores || r.counts.escalators < opts.escalators
          || r.counts.tunnelPairs < opts.tunnelPairs || r.counts.unusedEscalatorEnds > 0;
        if (short) continue;
        if (!fitting || r.counts.emptyHalls < fitting.counts.emptyHalls) fitting = r;
        if (r.counts.emptyHalls === 0) break;
      }
    }
    if (fitting) {
      result = fitting;
      if (opts.halls !== askedHalls) {
        hallsBox.value = opts.halls;
        hallsBox.classList.add("raised");
      }
    }
  }
  const wrap = document.getElementById("board-wrap");
  wrap.innerHTML = "";
  wrap.appendChild(render(result, seed));
  const c = result.counts;
  let html = `<b>Seed:</b> ${seed} &nbsp; 2 plazas (${c.hallsApart} halls apart), ${plural(c.halls, "hall")}, 4 big stores, ${plural(c.stores, "store")}, ${plural(c.security, "security room")}, ${plural(c.escalators, "escalator")}, ${plural(c.tunnelPairs, "tunnel pair")}.`;
  if (result.notes.length) html += "<br><b>Notes:</b> " + result.notes.join(" ");
  document.getElementById("summary").innerHTML = html;
}

document.getElementById("generate").addEventListener("click", () => run());
document.getElementById("starter").addEventListener("click", () => run(true));
document.getElementById("randomize").addEventListener("click", () => {
  document.getElementById("seed").value = "mall-" + Math.floor(Math.random() * 100000);
  run();
});
document.getElementById("save").addEventListener("click", () => {
  const svg = document.querySelector("#board-wrap svg");
  const seed = document.getElementById("seed").value || "mall";
  const url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)], { type: "image/svg+xml" }));
  const img = new Image();
  img.onload = () => {
    const scale = 2;
    const canvas = document.createElement("canvas");
    canvas.width = svg.width.baseVal.value * scale;
    canvas.height = svg.height.baseVal.value * scale;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = BOARD_BG;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(url);
    const link = document.createElement("a");
    link.download = seed.replace(/[^\w-]+/g, "_") + ".png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  };
  img.src = url;
});
run(true);
</script>
